name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libportaudio2 libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax and Import Verification
        run: |
          python -c "import cv2, mediapipe, numpy, sounddevice, scipy; print('All core libraries imported successfully!')"
          python -m compileall .
