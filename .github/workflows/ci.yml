name: CI

on:
  push:
    branches: [ main, master, research-upgrade-v2 ]
  pull_request:
    branches: [ main, master, research-upgrade-v2 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system audio and OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libportaudio2 libsndfile1 libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Install Package and Test Entry Point
        run: |
          python -m pip install --no-deps .
          cd /tmp
          gesture-ar --help
          python -c "import main; print('Installed location:', main.__file__)"

      - name: Isolated Fresh-Env Install Smoke Test
        run: |
          python -m venv fresh-env
          ./fresh-env/bin/python -m pip install --upgrade pip
          ./fresh-env/bin/pip install .
          ./fresh-env/bin/python -m pip check
          ./fresh-env/bin/gesture-ar --help
          ./fresh-env/bin/python -c "import main, vision_tracker, gesture_engine, instruments, audio_engine; print('Fresh environment import success!')"
          ./fresh-env/bin/python -c "import mediapipe as mp; assert hasattr(mp, 'solutions') and hasattr(mp.solutions, 'hands'), 'Missing mp.solutions.hands'; from vision_tracker import HandTracker; tracker = HandTracker(init_mediapipe=True); assert tracker.hands is not None, 'MediaPipe Hands graph failed to initialize'; tracker.close(); print('MediaPipe Hands graph initialized and closed cleanly!')"

      - name: Syntax and Bytecode Compilation
        run: |
          python -c "import cv2, mediapipe, numpy, sounddevice; print('Core libraries imported successfully!')"
          python -m compileall .

      - name: Code Quality & Linting
        run: |
          python -m ruff check .

      - name: Headless Test Suite
        run: |
          python -m pytest -q

      - name: Tracking Filter Benchmark Verification
        run: |
          python benchmark_filters.py
          git diff --exit-code -- benchmarks/filter_benchmark_results.csv

  windows-release-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Install Package and Test Entry Point
        run: |
          python -m pip install --no-deps .
          gesture-ar --help
          python -c "import main; print('Installed location:', main.__file__)"

      - name: Syntax and Bytecode Compilation
        run: |
          python -c "import cv2, mediapipe, numpy, sounddevice; print('Core libraries imported successfully!')"
          python -m compileall .

      - name: Code Quality & Linting
        run: |
          python -m ruff check .

      - name: Headless Test Suite
        run: |
          python -m pytest -q

      - name: Tracking Filter Benchmark Verification
        run: |
          python benchmark_filters.py
          git diff --exit-code -- benchmarks/filter_benchmark_results.csv

      - name: Windows Isolated Fresh-Env Install & External Directory Smoke Test
        shell: powershell
        run: |
          python -m venv fresh-env-win
          .\fresh-env-win\Scripts\python -m pip install --upgrade pip
          .\fresh-env-win\Scripts\pip install .
          .\fresh-env-win\Scripts\python -m pip check
          $envPython = (Resolve-Path .\fresh-env-win\Scripts\python.exe).Path
          $envGestureAr = (Resolve-Path .\fresh-env-win\Scripts\gesture-ar.exe).Path
          $env:REPO_ROOT = (Get-Location).Path
          $tempDir = [System.IO.Path]::GetTempPath()
          Set-Location $tempDir
          & $envGestureAr --help
          & $envPython -c "import os, main; print('Resolved main.__file__:', main.__file__); mf = os.path.abspath(main.__file__).lower(); rf = os.path.abspath(os.environ['REPO_ROOT']).lower(); assert 'site-packages' in mf, f'main not in site-packages: {main.__file__}'; assert not mf.startswith(rf), f'main imported from git checkout: {main.__file__}'"
          & $envPython -c "import mediapipe as mp; assert hasattr(mp, 'solutions') and hasattr(mp.solutions, 'hands'), 'Missing mp.solutions.hands'; from vision_tracker import HandTracker; tracker = HandTracker(init_mediapipe=True); assert tracker.hands is not None, 'MediaPipe Hands graph failed to initialize'; tracker.close(); print('Windows MediaPipe Hands graph initialized and closed cleanly in fresh env!')"
          Set-Location $env:REPO_ROOT



